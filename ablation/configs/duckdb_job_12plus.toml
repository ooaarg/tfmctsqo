name = "duckdb-job-12plus"
description = "DuckDB MCTS retention comparison on 20 queries with at least 12 relations."
run_group = "duckdb-imdb"
queries = [ "24a", "24b", "26a", "26b", "26c", "27a", "27b", "27c", "28a", "28b", "28c", "29a", "29b", "29c", "30a", "30b", "30c", "33a", "33b", "33c",]
configs = [ "single", "duckdb_default",]
reward_modes = [ "neg_log",]
uct_aggregations = [ "best",]
n_seeds = 5
seed_values = [ 314173644, 711896200, 1022572473, 1198589096, 1375321836,]
sources = [ "job",]
implementation = "duckdb_mctsopt"
measurement = "full_protocol"

[runtime]
binary = "/path/to/duckdb"
database = "/path/to/imdb-original-layout.duckdb"
extension = "/path/to/duckdb_mctsopt.duckdb_extension"
cache = "cold"
timeout_seconds = 30
threads = 1
memory_limit = "8192MB"

[gucs.shared]
min_relations = 0
plan_shape = 1
force_left_tree = false
depth = 10
top_k = 20
exploration_constant = 0.05
gamma = 0.5
rollout = "rank_biased"
rollouts_per_leaf = 1
expand_strategy = "cost"
patience = 0
greedy_init = false
retention_enabled = [ true, false,]
retention_max_group_fraction = [ 1.0, 0.5,]

[gucs.luby]

[gucs.single]
start_budget = 250
phases = 1
luby_enabled = false
