name = "duckdb-shared-job"
implementation = "duckdb_mctsopt"
source = "job"
queries = ["1a", "28a", "33a"]
configs = ["single", "duckdb_default"]
reward_modes = ["neg_log"]
uct_aggregations = ["best"]
n_seeds = 3

[runtime]
binary = "/path/to/duckdb"
database = "/path/to/imdb.duckdb"
extension = "/path/to/duckdb_mctsopt.duckdb_extension"
cache = "cold"
timeout_seconds = 30
threads = 1
memory_limit = "8192MB"

[gucs.shared]
min_relations = 12
plan_shape = 2
depth = 10
top_k = 20
exploration_constant = 0.05
greedy_init = false

[gucs.single]
start_budget = 250
phases = 1
luby_enabled = false
