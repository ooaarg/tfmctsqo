name = "pg-shared-stack"
implementation = "pg_mctsopt"
db = "stack"
source = "stack-geqo-balanced-200"
queries = ["q2_q2-001", "q3_q3-001", "q8_q8-003"]
configs = ["single", "pg_default"]
reward_modes = ["neg_log"]
uct_aggregations = ["best"]
n_seeds = 3

[runtime]
extension = "/path/to/pg_mctsopt.so"
cache = "cold"
timeout_seconds = 30
work_mem = "64MB"
collapse_limit = 64

[gucs.shared]
min_relations = 12
plan_shape = 1
depth = 10
top_k = 10
exploration_constant = 1.41

[gucs.single]
start_budget = 480
phases = 1
luby_enabled = false
